name: Build CopilotChat IPA

on:
  push:
    paths:
      - '.github/workflows/build-copilotchat-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned CopilotChat IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout CopilotChat source
        uses: actions/checkout@v4
        with:
          repository: jason5545/CopilotChat
          ref: main
          fetch-depth: 1

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project CopilotChat.xcodeproj \
            -scheme CopilotChat

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project CopilotChat.xcodeproj \
            -scheme CopilotChat \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CopilotChatDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/CopilotChatDerivedData/Build/Products/Release-iphoneos/CopilotChat.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/CopilotChat.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/CopilotChat-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/CopilotChat-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopilotChat-unsigned-IPA
          path: CopilotChat-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
