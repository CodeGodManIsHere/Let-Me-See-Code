name: Feature request
description: Suggest a focused improvement to capture, output, safety, or usability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and examples
      description: Explain which mode, archive evidence, or website pattern this affects. Do not share private captures.
  - type: textarea
    id: tradeoffs
    attributes:
      label: Performance, privacy, and safety considerations
      description: Could this increase capture time, archive size, permissions, or automatic interaction risk?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request concerns browser-exposed evidence and does not depend on private server access.
          required: true

